# Local voice services (Home Assistant's own "Wyoming" stack), Max himself, optional local LLM.
#   docker compose up -d                       voice services only (run Max with npm on the host)
#   docker compose --profile max up -d --build voice services + Max in a container
#   docker compose run --rm max node dist/tools/chat.js     type to Max (no audio needed)
#   add --profile local-llm for Ollama
# Running Max in Docker on a Mac/Windows laptop needs a sound bridge: see docs/DOCKER.md.
services:
  max:
    build: .
    profiles: ["max"]
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside Docker the voice services are reached by name, not 127.0.0.1.
      WAKEWORD_HOST: openwakeword
      STT_HOST: whisper
      TTS_HOST: piper
      # Sound bridge (docs/DOCKER.md). Default suits Mac + Windows Docker Desktop.
      PULSE_SERVER: ${PULSE_SERVER:-tcp:host.docker.internal:4713}
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: [openwakeword, whisper, piper]

  openwakeword:
    image: rhasspy/wyoming-openwakeword:latest
    restart: unless-stopped
    # Custom models (e.g. hey_max.tflite) go in ./wakewords - see training/README.md.
    # Tuning: raise --threshold (0-1) if Max wakes up by mistake, lower it if he misses you.
    #         --trigger-level 2 needs two consecutive hits: fewer false wakes, slightly slower.
    command: --custom-model-dir /custom --threshold 0.5 --trigger-level 1
    volumes: ["./wakewords:/custom"]
    ports: ["10400:10400"]

  whisper:
    image: rhasspy/wyoming-whisper:latest
    restart: unless-stopped
    # base-int8 is a good CPU default; use small-int8 for accuracy, tiny-int8 for speed.
    command: --model base-int8 --language en
    volumes: ["./data/whisper:/data"]
    ports: ["10300:10300"]

  piper:
    image: rhasspy/wyoming-piper:latest
    restart: unless-stopped
    # British male voice; browse others at https://rhasspy.github.io/piper-samples/
    command: --voice en_GB-alan-medium
    volumes: ["./data/piper:/data"]
    ports: ["10200:10200"]

  ollama:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    restart: unless-stopped
    volumes: ["./data/ollama:/root/.ollama"]
    ports: ["11434:11434"]
    # Uncomment for an NVIDIA GPU (needs nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
